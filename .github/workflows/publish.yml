# 推送 v* tag：构建、发布 GitHub Pages，并用该 tag 创建 Release。
# 仓库 Settings → Pages → Source 选 GitHub Actions。
# 若 Pages 环境限制了部署分支，需允许 tag，否则网页这一步会失败。

name: 发布

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch-vendor.py') }}

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载上游字体
        run: python scripts/fetch-vendor.py

      - name: 构建
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - name: 准备 Pages 站点
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dist/index.html _site/index.html
          cp dist/preview.html _site/preview.html
          cp dist/XiaoheiziMono-Regular.woff2 dist/XiaoheiziMono-Light.woff2 dist/XiaoheiziEmoji-Regular.woff2 dist/XiaoheiziEmoji3D-Regular.woff2 dist/XiaoheiziNoEmoji.woff2 _site/
          cp dist/coverage.js dist/coverage-blocks.md _site/
          cp dist/OFL.txt dist/JetBrainsMono-OFL.txt dist/NotoEmoji-OFL.txt dist/FluentEmoji-MIT-Microsoft.txt dist/FluentEmoji-MIT-tetunori.txt _site/
          cp LICENSE _site/LICENSE

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: |
            dist/Xiaoheizi*.ttf
            dist/Xiaoheizi*.woff2
            dist/OFL.txt
            dist/JetBrainsMono-OFL.txt
            dist/NotoEmoji-OFL.txt
            dist/FluentEmoji-MIT-Microsoft.txt
            dist/FluentEmoji-MIT-tetunori.txt
          if-no-files-found: error

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fonts
          path: dist

      - name: 用该 tag 创建 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在：${TAG}"
            exit 0
          fi
          shopt -s nullglob
          files=(dist/Xiaoheizi*.ttf dist/Xiaoheizi*.woff2 dist/OFL.txt dist/JetBrainsMono-OFL.txt dist/NotoEmoji-OFL.txt dist/FluentEmoji-MIT-Microsoft.txt dist/FluentEmoji-MIT-tetunori.txt)
          NOTES="由 tag \`${TAG}\` 自动构建，对应提交 \`${GITHUB_SHA:0:7}\`。字体按 SIL OFL 1.1 发布，见附件 \`OFL.txt\`。"$'\n\n'"- 小黑字等宽 \`Xiaoheizi Mono\` Regular（400）与 Light（300）"$'\n'"- 小黑字表情 \`Xiaoheizi Emoji\`（谷歌 Noto 风格）"$'\n'"- 小黑字表情立体 \`Xiaoheizi Emoji 3D\`（微软 Fluent 风格；附 MIT 声明，字体仍按 OFL 分发）"$'\n\n'"字符测试页与覆盖表见 GitHub Pages，不在本 Release 里。"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "小黑字等宽 ${TAG}" \
            --notes "$NOTES" \
            "${files[@]}"
